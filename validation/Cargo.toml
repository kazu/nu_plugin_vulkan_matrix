[package]
name = "vulkan-matrix-validation"
version = "0.10.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
nu_plugin_vulkan_matrix = { path = "..", version = "0.10" }
cubecl = { version = "=0.11.0", default-features = false, features = ["std", "stdlib", "vulkan"] }
cubecl-runtime = { version = "=0.11.0", default-features = false, features = ["std"] }
cubek-matmul = { version = "=0.3.0", default-features = false, features = ["std", "tiled", "multi-level"] }
cubek-std = { version = "=0.3.0", default-features = false, features = ["std"] }
ndarray = { version = "=0.17.2", features = ["rayon", "matrixmultiply-threading"] }

[dev-dependencies]
criterion = "=0.7.0"
cubecl-spirv = "=0.11.0"
npyz = "0.9.1"
rmp-serde = "1"

[profile.dev]
debug = 0

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "transfers"
harness = false

[[bench]]
name = "reductions"
harness = false
